name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test & race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: adapter modules build
        run: |
          (cd chi && go build ./...)
          (cd gin && go build ./...)
          (cd echo && go build ./...)
      - name: examples build
        run: |
          (cd examples/chi-demo && go build ./...)
          (cd examples/gin-demo && go build ./...)
          (cd examples/echo-demo && go build ./...)

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

  release:
    name: release iam-codegen
    if: ${{ github.ref == 'refs/tags/v0.1.0' }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
