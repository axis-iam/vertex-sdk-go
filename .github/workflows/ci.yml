name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test & race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            go.sum
            chi/go.sum
            gin/go.sum
            echo/go.sum
      - name: Verify pre-tag workspace
        run: |
          test "$(go env GOWORK)" = "$GITHUB_WORKSPACE/go.work"
          go list -m all
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: adapter modules build
        run: |
          (cd chi && go test ./... && go build ./...)
          (cd gin && go test ./... && go build ./...)
          (cd echo && go test ./... && go build ./...)
      - name: examples build
        run: |
          (cd examples/chi-demo && go build ./...)
          (cd examples/gin-demo && go build ./...)
          (cd examples/echo-demo && go build ./...)

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: true

  release:
    name: release iam-codegen
    if: ${{ github.ref == 'refs/tags/v0.1.1' }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
